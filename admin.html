<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - CPUT Lost & Found</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="navbar">
    <div class="logo">CPUT Admin Dashboard</div>
    <nav>
      <a href="index.html">Back to Main Site</a>
    </nav>
  </header>

  <main class="container">
    <h2>Manage Database Items</h2>
    <table class="admin-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Type</th>
          <th>Campus</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="adminTableBody"></tbody>
    </table>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", fetchAdminItems);
  </script>
</body>
</html>
